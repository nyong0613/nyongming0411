<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>밍무위키 - 열람 권한 확인</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f3f4f4;color:#202425}
.card{width:min(570px,100%);background:#fff;border:1px solid #d7dada;border-radius:13px;box-shadow:0 18px 45px rgba(0,0,0,.09);padding:41px 38px 34px}
.eyebrow{color:#08796f;font-size:15px;font-weight:900;letter-spacing:.09em;margin-bottom:12px}
h1{margin:0 0 12px;font-size:31px;line-height:1.25;letter-spacing:-.045em}
.desc{color:#626b6c;font-size:16px;line-height:1.75;margin-bottom:27px}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:800;color:#242929}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;height:56px;border:1px solid #bfc9c8;border-radius:8px;background:#fff;padding:0 17px;font-size:17px;outline:none}
input:focus{border-color:#21b9aa;box-shadow:0 0 0 3px rgba(33,185,170,.15)}
button{height:56px;padding:0 23px;border:0;border-radius:7px;background:#087f74;color:white;font-size:16px;font-weight:900;cursor:pointer}
button:hover{background:#066e65}
#msg{min-height:24px;margin-top:10px;color:#bf4f5e;font-size:13px}
.help{margin-top:26px;color:#989e9e;font-size:13px}
#frame{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
body.auth-checking #gate{visibility:hidden}
@media(max-width:620px){
 body{padding:15px} .card{padding:31px 22px 27px} h1{font-size:25px} .desc{font-size:14px}
 .row{gap:8px} input{height:52px;font-size:15px} button{height:52px;padding:0 17px;font-size:14px}
}
</style>
</head>

    <button id="btn" type="button">입장하기</button>
  </div>
  <div id="msg"></div>
  <div class="help">영문/숫자로 된 암호를 입력해 주십시오.</div>

const DB_NAME='mingwiki-auth', DB_VERSION=1, STORE_NAME='keys', KEY_ID='contentKey:'+SALT;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function saveKey(key){try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(key,KEY_ID);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});db.close();}catch(e){}}
async function loadKey(){try{const db=await openDB();const result=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readonly');const req=tx.objectStore(STORE_NAME).get(KEY_ID);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});db.close();return result;}catch(e){return null;}}
async function deleteSavedKey(){try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).delete(KEY_ID);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});db.close();}catch(e){}}
async function decryptPage(key){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NONCE)},key,b64(DATA));return new TextDecoder().decode(plain);}
function showPage(page){const frame=document.getElementById('frame');frame.srcdoc=page;frame.style.display='block';document.getElementById('gate').style.display='none';document.body.classList.remove('auth-checking');document.title='밍무위키';}
function showGate(){document.body.classList.remove('auth-checking');document.getElementById('gate').style.display='block';setTimeout(()=>document.getElementById('pw').focus(),0);}
async function unlock(){
 const input=document.getElementById('pw'),msg=document.getElementById('msg');
 if(!input.value){msg.textContent='암호를 입력해 주십시오.';return;}
 msg.textContent='열람 권한 확인 중...';
 try{
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITERATIONS,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const page=await decryptPage(key);await saveKey(key);showPage(page);
 }catch(e){msg.textContent='접근 권한이 없습니다. 뇽에게 문의하십시오.';input.select();}
}
async function tryAutoUnlock(){const savedKey=await loadKey();if(!savedKey){showGate();return;}try{const page=await decryptPage(savedKey);showPage(page);}catch(e){await deleteSavedKey();showGate();}}
document.getElementById('btn').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
tryAutoUnlock();
</script>
