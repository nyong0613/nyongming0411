<title>밍무위키 - 열람 권한 확인</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f3f4f4;color:#202425}
.card{width:min(570px,100%);background:#fff;border:1px solid #d7dada;border-radius:13px;box-shadow:0 18px 45px rgba(0,0,0,.09);padding:41px 38px 34px}
.eyebrow{color:#08796f;font-size:15px;font-weight:900;letter-spacing:.09em;margin-bottom:12px}
h1{margin:0 0 12px;font-size:31px;line-height:1.25;letter-spacing:-.045em}
.desc{color:#626b6c;font-size:16px;line-height:1.75;margin-bottom:27px}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:800;color:#242929}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;height:56px;border:1px solid #bfc9c8;border-radius:8px;background:#fff;padding:0 17px;font-size:17px;outline:none}
input:focus{border-color:#21b9aa;box-shadow:0 0 0 3px rgba(33,185,170,.15)}
button{height:56px;padding:0 23px;border:0;border-radius:7px;background:#087f74;color:white;font-size:16px;font-weight:900;cursor:pointer}
button:hover{background:#066e65}
#msg{min-height:24px;margin-top:10px;color:#bf4f5e;font-size:13px}
.help{margin-top:26px;color:#989e9e;font-size:13px}
#frame{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
@media(max-width:620px){
 body{padding:15px} .card{padding:31px 22px 27px} h1{font-size:25px} .desc{font-size:14px}
 .row{gap:8px} input{height:52px;font-size:15px} button{height:52px;padding:0 17px;font-size:14px}
}
</style>
</head>

<div class="card" id="gate">
  <div class="eyebrow">MING WIKI · PRIVATE</div>
  <h1>🔐 밍무위키 열람 권한 확인</h1>
  <div class="desc">본 문서는 밍 및 관계자에게만 열람이 허용되어 있습니다.<br>암호를 입력하면 문서가 열립니다.</div>
  <label for="pw">암호</label>
  <div class="row">
    <input id="pw" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="암호 입력">
    <button id="btn" type="button">입장하기</button>
  </div>
  <div id="msg"></div>
  <div class="help">영문/숫자로 된 암호를 입력해 주십시오.</div>
</div>
