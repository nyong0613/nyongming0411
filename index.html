<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>밍무위키 - 열람 권한 확인</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
    body{background:#f4f5f6;color:#222}
    #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f4f5f6}
    .card{width:min(430px,100%);background:#fff;border:1px solid #d8d8d8;border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.08);padding:30px 28px 26px}
    .brand{font-size:13px;color:#08796f;font-weight:800;letter-spacing:.08em;margin-bottom:8px}
    h1{margin:0 0 9px;font-size:26px;letter-spacing:-1px}
    .desc{color:#666;font-size:14px;line-height:1.65;margin-bottom:22px}
    label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}
    .row{display:flex;gap:8px}
    input{min-width:0;flex:1;padding:11px 12px;border:1px solid #c8c8c8;border-radius:5px;font-size:15px;outline:none}
    input:focus{border-color:#00a495;box-shadow:0 0 0 3px rgba(0,164,149,.10)}
    button{border:0;border-radius:5px;padding:0 16px;background:#08796f;color:#fff;font-weight:800;cursor:pointer;white-space:nowrap}
    button:hover{background:#06685f}
    #msg{min-height:22px;margin-top:10px;font-size:13px;color:#c0392b}
    .small{font-size:11px;color:#999;margin-top:16px;line-height:1.5}
    #siteFrame{display:none;width:100%;height:100vh;border:0;background:#fff}
    .shake{animation:shake .25s linear 1}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  </style>
</head>

  <div id="gate">
    <div class="card" id="card">
      <div class="brand">MING WIKI · PRIVATE</div>
      <h1>🔐 밍무위키 열람 권한 확인</h1>
      <div class="desc">본 문서는 밍 및 관계자에게만 열람이 허용되어 있습니다.<br>암호를 입력하면 문서가 열립니다.</div>
      <label for="pw">암호</label>
      <div class="row">
        <input id="pw" type="password" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="암호 입력">
        <button id="openBtn" type="button">입장하기</button>
      </div>
      <div id="msg"></div>
      <div class="small">영문/숫자로 된 암호를 입력해 주십시오.</div>
    </div>
  </div>

    const ITERATIONS = 250000;

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function deriveKey(password) {
      const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:b64ToBytes(SALT),iterations:ITERATIONS,hash:"SHA-256"},
        baseKey,
        {name:"AES-GCM",length:256},
        false,
        ["decrypt"]
      );
    }

    async function unlock() {
      const input = document.getElementById("pw");
      const msg = document.getElementById("msg");
      const card = document.getElementById("card");
      const password = input.value;

      if (!password) {
        msg.textContent = "암호를 입력해 주십시오.";
        return;
      }

      msg.textContent = "열람 권한 확인 중...";
      try {
        const key = await deriveKey(password);
        const plainBuffer = await crypto.subtle.decrypt(
          {name:"AES-GCM",iv:b64ToBytes(NONCE)},
          key,
          b64ToBytes(DATA)
        );

        const siteHtml = new TextDecoder().decode(plainBuffer);
        const frame = document.getElementById("siteFrame");
        frame.srcdoc = siteHtml;
        document.getElementById("gate").style.display = "none";
        frame.style.display = "block";
        document.title = "밍무위키";
      } catch (e) {
        msg.textContent = "접근 권한이 없습니다. 뇽에게 문의하십시오.";
        input.select();
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
    }

    document.getElementById("openBtn").addEventListener("click", unlock);
    document.getElementById("pw").addEventListener("keydown", e => {
      if (e.key === "Enter") unlock();
    });
    document.getElementById("pw").focus();
  </script>
</body>
</html>
